<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Ambient Glow Badge -->
  <polygon points="256,120 410,340 256,280 102,340" fill="url(#chevronGrad)" opacity="0.3" filter="url(#glow)" />

  <!-- Upper Aero Wing Accent -->
  <polygon points="256,100 370,260 256,220 142,260" fill="url(#accentGrad)" opacity="0.85" />

  <!-- Main Automotive Chevron Crest -->
  <polygon points="256,140 400,350 256,300 112,350" fill="url(#chevronGrad)" />

  <!-- Center Core Crest Highlight -->
  <polygon points="256,170 330,285 256,260 182,285" fill="#ffffff" opacity="0.25" />
</svg>
